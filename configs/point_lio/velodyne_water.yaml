# Point-LIO 水上数据配置 (W06/N03/H05: 16线 90°FOV 前视雷达 + IMU)
# 基于 velody16.yaml 修改：话题改 /points_raw + /imu_correct、
# timestamp_unit=0(秒，water bag time 字段为秒)、scan_line=16、外参单位阵近似
common:
    lid_topic: "/points_raw"
    imu_topic: "/imu_correct"
    con_frame: false
    con_frame_num: 1
    cut_frame: false
    cut_frame_time_interval: 0.1
    time_diff_lidar_to_imu: 0.0

preprocess:
    lidar_type: 2
    scan_line: 16
    timestamp_unit: 0           # water bag time 字段单位为秒 (0-second, 1-ms, 2-us, 3-ns)
    blind: 0.5

mapping:
    imu_en: true
    extrinsic_est_en: false
    imu_time_inte: 0.01
    lidar_time_inte: 0.1
    satu_acc: 30.0
    satu_gyro: 35
    acc_norm: 9.81
    lidar_meas_cov: 0.01
    acc_cov_output: 500
    gyr_cov_output: 1000
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    imu_meas_acc_cov: 0.1
    imu_meas_omg_cov: 0.1
    gyr_cov_input: 0.01
    acc_cov_input: 0.1
    plane_thr: 0.1
    match_s: 81
    ivox_grid_resolution: 2.0
    gravity: [0.0, 0.0, -9.810]
    gravity_init: [0.0, 0.0, -9.810]
    extrinsic_T: [0, 0, 0]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1 ]

odometry:
    publish_odometry_without_downsample: false

publish:
    path_en: true
    scan_publish_en: true
    scan_bodyframe_pub_en: false

pcd_save:
    pcd_save_en: false
    interval: -1
